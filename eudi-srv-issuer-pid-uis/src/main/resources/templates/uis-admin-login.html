<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/public/css/main.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/public/css/uis-admin.css}">
    <title>UIS :: Acceso al panel de estudiantes</title>
</head>
<body class="uis-admin acceso">
<div class="caja">
    <div class="cabeza">
        <img th:src="@{/public/img/uis-credential-blanco.png}" alt="Universidad Industrial de Santander">
        <h1 class="h5 mb-0">Registro académico</h1>
        <small>Panel de estudiantes</small>
    </div>
    <div class="cuerpo">
        <div class="alert alert-danger py-2" th:if="${error}">Usuario o contraseña incorrectos.</div>
        <form method="post" th:action="@{/uis/admin/login}">
            <div class="mb-3"><label class="form-label" for="username">Usuario</label>
                <input class="form-control" id="username" name="username" autofocus required></div>
            <div class="mb-3"><label class="form-label" for="password">Contraseña</label>
                <input class="form-control" id="password" name="password" type="password" required></div>
            <button class="btn btn-primary w-100" type="submit">Entrar</button>
        </form>
    </div>
    <div class="accent"></div>
</div>
<p class="pie">Datos de prueba, no uses información real.</p>
</body>
</html>
