global
    maxconn 50000
    log stdout format raw local0
    user root
    group root
    nbthread 4
    cpu-map auto:1/1-4 0-3
    ssl-default-bind-options ssl-min-ver TLSv1.1

defaults
    timeout connect 10s
    timeout client 30s
    timeout server 30s
    log global
    mode http
    option httplog
    maxconn 3000
    default_backend no-match

# Resolucion dinamica: los backends se registran y desaparecen de la red
# compartida `avance-eudi` sin que haya que reiniciar el haproxy.
resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend all
    # Solo en claro: el trafico llega por el proxy unico nw-nginx, que ya
    # termina TLS (el borde publico lo termina antes). Este haproxy no
    # publica puertos en el host.
    bind 0.0.0.0:80
    # TLS directo: solo para pruebas locales contra el propio haproxy.
    bind 0.0.0.0:443 ssl crt /etc/ssl/certs/civica-desarrollo.tls.pem

    # Keycloak de la UIS, en su propio prefijo: `/idp` ya lo usa la
    # Registraduria y los dos Keycloak no pueden coexistir bajo el mismo.
    use_backend keycloak-backend if { path_beg /idp-uis }
    use_backend keycloak-backend if { path_beg /.well-known/oauth-authorization-server/idp-uis/realms/uis-issuer-realm }
    use_backend keycloak-backend if { path_beg /.well-known/openid-configuration/idp-uis/realms/uis-issuer-realm }
    # Metadata OID4VCI del issuer de la UIS.
    use_backend uis-issuer-backend if { path_beg /.well-known/openid-credential-issuer/uis-issuer }
    use_backend uis-issuer-backend if { path_beg /.well-known/oauth-protected-resource/uis-issuer }
    use_backend uis-issuer-backend if { path_beg /.well-known/jwt-vc-issuer/uis-issuer }
    use_backend uis-issuer-metadata if { path /.well-known/jwt-issuer/uis-issuer }
    # Canje interno de tickets (solo red docker: lo llama Keycloak). Nunca al exterior.
    http-request deny deny_status 404 if { path_beg /uis-issuer/internal/ }
    use_backend uis-issuer-backend if { path_beg /uis-issuer }
    use_backend status-list-backend if { path_beg /token_status_list }

backend keycloak-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    option forwarded proto host by by_port for
    http-request set-path /idp-uis/realms/uis-issuer-realm/.well-known/oauth-authorization-server if { path_beg /.well-known/oauth-authorization-server/idp-uis/realms/uis-issuer-realm }
    http-request set-path /idp-uis/realms/uis-issuer-realm/.well-known/openid-configuration if { path_beg /.well-known/openid-configuration/idp-uis/realms/uis-issuer-realm }
    server server1 keycloak-uis:8080 cookie server1 resolvers docker init-addr libc,none

backend uis-issuer-metadata
    http-request return status 200 content-type application/json lf-string "{\"issuer\":\"https://civica-desarrollo.avance.org.co/uis-issuer\",\"jwks_uri\":\"https://civica-desarrollo.avance.org.co/uis-issuer/public_keys.jwks\"}"

backend uis-issuer-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    # SIN "option forwarded": esa opcion borra las cabeceras X-Forwarded-* que llegan
    # del cliente y pone las de haproxy, que es http (nginx le habla en claro). El
    # emisor reconstruye con ellas la URI de la peticion para validar el htu del DPoP,
    # asi que necesita recibir las que dice nginx (https, la URL publica del emisor).
    http-request set-header X-Forwarded-Proto %[req.hdr(X-Forwarded-Proto)]
    http-request set-header X-Forwarded-Host %[req.hdr(X-Forwarded-Host)]
    # Spring (estrategia "framework") reconstruye la URI de la peticion con la
    # cabecera "Forwarded" (RFC 7239), que es contra la que valida el htu del DPoP.
    http-request set-header Forwarded %[req.hdr(Forwarded)]
    http-request set-path /uis-issuer/.well-known/openid-credential-issuer if { path_beg /.well-known/openid-credential-issuer/uis-issuer }
    http-request set-path /uis-issuer/.well-known/oauth-protected-resource if { path_beg /.well-known/oauth-protected-resource/uis-issuer }
    http-request set-path /uis-issuer/.well-known/jwt-vc-issuer if { path_beg /.well-known/jwt-vc-issuer/uis-issuer }
    server server1 uis-issuer:8080 cookie server1 resolvers docker init-addr libc,none

backend status-list-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    option forwarded proto host by by_port for
    server server1 status-list-uis:5000 cookie server1 resolvers docker init-addr libc,none

backend no-match
    http-request deny deny_status 404
