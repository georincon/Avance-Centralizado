name: uis-issuer

# Todos los servicios llevan `restart: unless-stopped`: si el PC o Docker se reinician, vuelven solos.
# Un `docker stop` explicito (el panel lo usa para cambiar de consola de Keycloak) si se respeta.

# `avance-eudi` es la red compartida del ecosistema: el proxy unico
# (srv-nw-nginx) enruta por nombre de servicio, asi que este proyecto tiene que
# estar en ella. No es de este proyecto: `docker compose down` no la borra.
#
# Los nombres de servicio llevan sufijo (`-uis`) a proposito: en la red
# compartida `status-list` y `haproxy` ya son alias de los servicios de la
# Registraduria. Dos servicios con el mismo nombre en la misma red hacen que el
# DNS de Docker devuelva una IP u otra de forma indistinta.
networks:
  uisissuer:
    name: uis-issuer_default
    external: true
  avance-eudi:
    name: avance-eudi
    external: true

services:
  postgres-uis-issuer:
    image: postgres:18.4-alpine3.24
    container_name: postgres-uis-issuer
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UIS_ISSUER_DB_PORT:-5434}:5432"
    environment:
      - POSTGRES_DB=uis_issuer
      - POSTGRES_USER=uis_issuer
      - POSTGRES_PASSWORD=uis_issuer
    volumes:
      - ./postgresql/schema/uis_issuer.sql:/docker-entrypoint-initdb.d/01-uis_issuer.sql:RO
      - postgres-uis-issuer:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U uis_issuer -d uis_issuer" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - uisissuer

  postgres-uis-academic:
    image: postgres:18.4-alpine3.24
    container_name: postgres-uis-academic
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UIS_ACADEMIC_DB_PORT:-5433}:5432"
    environment:
      - POSTGRES_DB=uis_academic
      - POSTGRES_USER=uis_academic
      - POSTGRES_PASSWORD=uis_academic
    volumes:
      - ./postgresql/schema/uis_academic.sql:/docker-entrypoint-initdb.d/01-uis_academic.sql:RO
      - postgres-uis-academic:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U uis_academic -d uis_academic" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - uisissuer

  keycloak-uis:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
      args:
        VERSION: ${KEYCLOAK_ABCA_EXTENSION_VERSION}
    image: keycloak-abca-uis:${KEYCLOAK_ABCA_EXTENSION_VERSION}
    container_name: keycloak-uis
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
      - --features=dpop,passkeys
    environment:
      - KC_PROXY_HEADERS=forwarded
      - KC_HTTP_ENABLED=true
      - KC_HTTP_RELATIVE_PATH=/idp-uis
      - KC_HOSTNAME=https://civica-desarrollo.avance.org.co/idp-uis
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_HTTPS_CERTIFICATE_FILE=/etc/ssl/certs/keycloak.tls.crt
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/etc/ssl/certs/keycloak.tls.key
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=password
      # Login SOLO por ticket (issuer_state): Keycloak canjea el ticket en el issuer; el usuario lo mantiene el panel, no se crea aquí.
      - ISSUER_TICKET_REDEEM_URL=http://uis-issuer:8080/uis-issuer/internal/v1/tickets/redeem
      - ISSUER_TICKET_API_KEY=${UIS_TICKET_API_KEY:-uis-ticket-key-dev}
      - ISSUER_STATE_CREATE_USERS=false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /idp-uis/health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_interval: 30s
      start_period: 30s
    volumes:
      - ./keycloak/realms/:/opt/keycloak/data/import
      - ./keycloak/certs/:/etc/ssl/certs/
      - ./keycloak/conf/keycloak.conf:/opt/keycloak/conf/keycloak.conf
      - keycloak-uis-data:/opt/keycloak/data
    networks:
      - uisissuer
      - avance-eudi

  status-list-uis:
    build:
      context: ./status-list
      dockerfile: Dockerfile
      args:
        VERSION: ${STATUS_LIST_VERSION}
    image: status-list:${STATUS_LIST_VERSION}
    container_name: status-list-uis
    restart: unless-stopped
    environment:
      API_key: aaa-bbb-ccc
    volumes:
      - ./status-list/config/config_service.py:/status-list/app/config_service.py
      - ./status-list/certs:/status-list/certs
      - status-lists:/var/opt/status_lists
      - status-lists-backups:/var/opt/status_list_backup
    networks:
      - uisissuer
      - avance-eudi

  uis-issuer:
    build:
      context: ..
      dockerfile: Dockerfile
    image: eudi-generic-credential-issuer:local
    container_name: uis-issuer
    restart: unless-stopped
    depends_on:
      keycloak-uis:
        condition: service_healthy
      postgres-uis-issuer:
        condition: service_healthy
      status-list-uis:
        condition: service_started
    volumes:
      - ./uis-issuer/issuer-keys.jks:/issuer-keys.jks
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxDirectMemorySize=64M
      # Sin el perfil `insecure`: el issuer valida los certificados de todo HTTPS saliente (el dominio publico
      # tiene certificado valido; el resto de servicios internos van por http en la red docker).
      - SPRING_WEBFLUX_BASE_PATH=/uis-issuer
      - SERVER_REACTIVE_SESSION_COOKIE_PATH=/uis-issuer
      - SERVER_REACTIVE_SESSION_COOKIE_SAME-SITE=lax
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_OPAQUETOKEN_CLIENTID=uis-issuer-srv
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_OPAQUETOKEN_CLIENTSECRET=zIKAV9DIIIaJCzHCVBPlySgU8KgY68U2
      - SPRING_HTTP_CODECS_MAXINMEMORYSIZE=8MB
      - ISSUER_PUBLICURL=https://civica-desarrollo.avance.org.co/uis-issuer
      - ISSUER_AUTHORIZATIONSERVER_PUBLICURL=https://civica-desarrollo.avance.org.co/idp-uis/realms/uis-issuer-realm
      # Por http: el certificado de keycloak-uis:8443 lo firma una CA que no esta en el
      # truststore del emisor, asi que con https la llamada fallaba el TLS y el emisor
      # no podia validar el token (401 en el credentialEndpoint). El salto es entre
      # contenedores de la misma red.
      - ISSUER_AUTHORIZATIONSERVER_INTROSPECTION=http://keycloak-uis:8080/idp-uis/realms/uis-issuer-realm/protocol/openid-connect/token/introspect
      # El emisor reconstruye con los headers de proxy la URI de la peticion, que es
      # contra lo que valida el htu del DPoP. Sin esto calculaba http:// (su URL
      # publica es https) y rechazaba la peticion con "JWT htu claim value rejected".
      - SERVER_FORWARD_HEADERS_STRATEGY=native
      - ISSUER_KEYSTORE_FILE=file:/issuer-keys.jks
      - ISSUER_KEYSTORE_TYPE=JKS
      - ISSUER_KEYSTORE_PASSWORD=keys
      - ISSUER_CREDENTIALREQUESTENCRYPTION_JWKS_ALIAS=request-encryption
      - ISSUER_CREDENTIALREQUESTENCRYPTION_JWKS_PASSWORD=request-encryption
      - ISSUER_NONCE_ENCRYPTIONKEY_ALIAS=nonce-encryption
      - ISSUER_NONCE_ENCRYPTIONKEY_PASSWORD=nonce-encryption
      - ISSUER_PID_MSO_MDOC_SIGNING_KEY_ALIAS=pid-issuance
      - ISSUER_PID_MSO_MDOC_SIGNING_KEY_PASSWORD=pid-issuance
      - ISSUER_PID_SD_JWT_VC_SIGNING_KEY_ALIAS=pid-issuance
      - ISSUER_PID_SD_JWT_VC_SIGNING_KEY_PASSWORD=pid-issuance
      - ISSUER_MDL_SIGNING_KEY_ALIAS=issuance
      - ISSUER_MDL_SIGNING_KEY_PASSWORD=issuance
      - ISSUER_LEARNINGCREDENTIAL_SIGNING_KEY_ALIAS=issuance
      - ISSUER_LEARNINGCREDENTIAL_SIGNING_KEY_PASSWORD=issuance
      - ISSUER_ACCESSCERTIFICATE_ALIAS=access-certificate
      - ISSUER_ACCESSCERTIFICATE_PASSWORD=access-certificate
      # Canal de administracion a Keycloak por http dentro de la red docker (el certificado interno es de la CA de
      # desarrollo y ya no se acepta a ciegas).
      - ISSUER_KEYCLOAK_SERVER_URL=http://keycloak-uis:8080/idp-uis
      - ISSUER_KEYCLOAK_AUTHENTICATION_REALM=master
      - ISSUER_KEYCLOAK_CLIENT_ID=admin-cli
      - ISSUER_KEYCLOAK_USERNAME=admin
      - ISSUER_KEYCLOAK_PASSWORD=password
      - ISSUER_KEYCLOAK_USER_REALM=uis-issuer-realm
      - ISSUER_DPOP_REALM=uis-issuer
      - ISSUER_TICKET_API_KEY=${UIS_TICKET_API_KEY:-uis-ticket-key-dev}
      # Panel de estudiantes (/uis-issuer/uis/admin): usuario y clave del registro académico (de pruebas)
      - ISSUER_UIS_VERIFIER_API=http://verifier-uis/verifier-uis
      - ISSUER_UIS_ADMIN_USERNAME=admin
      - ISSUER_UIS_ADMIN_PASSWORD=${UIS_ADMIN_PASSWORD:-UisAdmin-2026}
      - ISSUER_ACADEMIC_ENABLED=true
      # El carnet vale hasta el fin del periodo, pero su configuración no puede superar el periodo de estado preferido del issuer.
      - ISSUER_CARNET_SD_JWT_VC_DURATION=P31D
      - ISSUER_ACADEMIC_SD_JWT_VC_SIGNING_KEY_ALIAS=issuance
      - ISSUER_ACADEMIC_SD_JWT_VC_SIGNING_KEY_PASSWORD=issuance
      - ISSUER_ACADEMIC_SD_JWT_VC_DURATION=P31D
      - ISSUER_METADATA_PREFERRED-CLIENT-STATUS-PERIOD=P31D
      - ISSUER_ACADEMIC_SD_JWT_VC_NOTIFICATIONS_ENABLED=true
      - ISSUER_ACADEMIC_SD_JWT_VC_DIGESTS_HASH_ALGORITHM=sha-256
      - ISSUER_ACADEMIC_SD_JWT_VC_PROOFS_SUPPORTED_SIGNING_ALGORITHMS=ES256
      - ISSUER_ACADEMIC_ISSUING_COUNTRY=CO
      - ISSUER_ACADEMIC_ISSUING_JURISDICTION=CO-SAN
      - ISSUER_ACADEMIC_SD_JWT_VC_DISPLAY_LOGO_URI=https://civica-desarrollo.avance.org.co/uis-issuer/public/img/uis-credential.png
      - ISSUER_ACADEMIC_SD_JWT_VC_DISPLAY_LOGO_ALTERNATIVE_TEXT=Universidad Industrial de Santander
      # La credencial academica se muestra en espanol, como las de la Registraduria: el
      # nombre va con el tipo de credencial ("(SD-JWT VC Compact)") en su propia linea.
      - ISSUER_ACADEMIC_SD_JWT_VC_DISPLAY_NAME=Credencial Académica (SD-JWT VC Compact)
      - ISSUER_ACADEMIC_SD_JWT_VC_DISPLAY_LOCALE=es
      - SPRING_R2DBC_URL=r2dbc:pool:postgresql://postgres-uis-issuer:5432/uis_issuer
      - SPRING_R2DBC_USERNAME=uis_issuer
      - SPRING_R2DBC_PASSWORD=uis_issuer
      - ISSUER_UIS_DB_URL=r2dbc:pool:postgresql://postgres-uis-academic:5432/uis_academic
      - ISSUER_UIS_DB_USERNAME=uis_academic
      - ISSUER_UIS_DB_PASSWORD=uis_academic
      - ISSUER_STATUSLIST_SERVICE_GENERATE_URI=http://status-list-uis:5000/token_status_list/take
      # Revocar es POST /set (idx, uri, status). Antes apuntaba a /take, que asigna un indice nuevo y no revoca nada.
      - ISSUER_STATUSLIST_SERVICE_REVOKE_URI=http://status-list-uis:5000/token_status_list/set
      # Revocacion por titular (POST /internal/v1/credentials/revoke, solo desde la red docker)
      - ISSUER_REVOCATION_API_KEY=${UIS_REVOCATION_API_KEY:-uis-dev-revocation-key-change-me}
      - ISSUER_STATUSLIST_SERVICE_APIKEY=aaa-bbb-ccc
      - ISSUER_METADATA_DISPLAY_0_NAME=Digital Credentials Issuer
      - ISSUER_METADATA_DISPLAY_0_LOCALE=en
      # Emblema de la UIS en blanco y con fondo transparente: es lo que la wallet usa como
      # marca de agua de la credencial (el logo pequeno usa uis-credential.png).
      - ISSUER_METADATA_DISPLAY_0_LOGO_URI=https://civica-desarrollo.avance.org.co/uis-issuer/public/img/uis-credential-blanco.png
      - ISSUER_METADATA_DISPLAY_0_LOGO_ALTERNATIVE_TEXT=Emblema de la Universidad Industrial de Santander
      # Validacion de la WIA/KA de la wallet contra los anchors del Wallet Provider
      # publicados en la LoTE (ARF v3.0.0, ISSU_19).
      - ISSUER_TRUST_SERVICEURL=http://civica-trust-validator:8080/trust
      - ISSUER_METADATA_DISPLAY_1_NAME=Universidad Industrial de Santander
      - ISSUER_METADATA_DISPLAY_1_LOCALE=es
      - ISSUER_METADATA_DISPLAY_1_LOGO_URI=https://civica-desarrollo.avance.org.co/uis-issuer/public/img/uis-credential-blanco.png
      - ISSUER_METADATA_DISPLAY_1_LOGO_ALTERNATIVE_TEXT=Emblema de la Universidad Industrial de Santander
      - ISSUER_..h3wtRbSVXVGJVblxwHLQQivFN-iQiyyIGLmbFoNHpC8GRcKjuseUhbatzS-PGh7eDBPOCwh0VSgotEtjTiYKzA
    networks:
      # Necesaria para resolver `civica-trust-validator` (validacion de la WIA/KA).
      - avance-eudi
      - uisissuer

  haproxy-uis:
    image: haproxy:2.8.3
    container_name: haproxy-uis
    restart: unless-stopped
    depends_on:
      keycloak-uis:
        condition: service_healthy
      uis-issuer:
        condition: service_started
      status-list-uis:
        condition: service_started
    volumes:
      - ./haproxy/haproxy.conf:/usr/local/etc/haproxy/haproxy.cfg
      - ./haproxy/certs/:/etc/ssl/certs/
    networks:
      - uisissuer
      - avance-eudi

volumes:
  status-lists:
  status-lists-backups:
  postgres-uis-issuer:
  postgres-uis-academic:
  keycloak-uis-data:
