name: registraduria

# Todos los servicios llevan `restart: unless-stopped`: si el PC o Docker se reinician, vuelven solos.
# Un `docker stop` explicito (el panel lo usa para cambiar de consola de Keycloak) si se respeta.

# Stack PROPIO del issuer Registraduría (siempre arriba para pruebas).
# Acceso por dominio: https://civica-desarrollo.avance.org.co/pid-registraduria (puerto 443: requiere que uis-issuer/pid-issuer originales estén abajo)
# (para volver a dominio: cambiar KC_HOSTNAME, ISSUER_PUBLICURL, ISSUER_AUTHORIZATIONSERVER_PUBLICURL, keycloak.conf y el realm)
# Contenedores/volúmenes/red/puertos independientes de cualquier otro stack. PKI: scripts/generar-pki-registraduria.sh

networks:
  registraduria:
    name: registraduria_default
    external: true
  avance-eudi:
    name: avance-eudi
    external: true

services:
  postgres:
    image: postgres:18.4-alpine3.24
    container_name: postgres-reg
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REG_DB_PORT:-5441}:5432"
    environment:
      - POSTGRES_DB=pid_issuer
      - POSTGRES_USER=pid_issuer
      - POSTGRES_PASSWORD=pid_issuer
    volumes:
      - ./postgresql/schema:/docker-entrypoint-initdb.d:RO
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pid_issuer -d pid_issuer" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - registraduria

  keycloak:
    build:
      context: ./keycloak
      args:
        VERSION: ${KEYCLOAK_ABCA_EXTENSION_VERSION}
    image: keycloak-abca-reg:${KEYCLOAK_ABCA_EXTENSION_VERSION}
    container_name: keycloak-reg
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
      - --features=dpop,passkeys
    environment:
      - KC_PROXY_HEADERS=forwarded
      - KC_HTTP_ENABLED=true
      - KC_HTTP_RELATIVE_PATH=/idp-reg
      - KC_HOSTNAME=https://civica-desarrollo.avance.org.co/idp-reg
      # El backchannel es dinamico: Keycloak compone el token_endpoint y el
      # pushed_authorization_request_endpoint con el esquema de la peticion que le
      # llega, que es el que despues valida el DPoP (htu). Fijarlo rompe la
      # coincidencia entre el endpoint publicado y el validado.
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_HTTPS_CERTIFICATE_FILE=/etc/ssl/certs/keycloak.tls.crt
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/etc/ssl/certs/keycloak.tls.key
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=password
      # Login automático con issuer_state (extensión issuer-state-authenticator): canje del ticket en el issuer.
      - ISSUER_TICKET_REDEEM_URL=http://pid-issuer:8080/pid-registraduria/internal/v1/tickets/redeem
      - ISSUER_TICKET_API_KEY=reg-ticket-key-dev
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /idp-reg/health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_interval: 30s
      start_period: 30s
    volumes:
      - ./keycloak/realms/:/opt/keycloak/data/import
      - ./keycloak/certs/:/etc/ssl/certs/
      - ./keycloak/conf/keycloak.conf:/opt/keycloak/conf/keycloak.conf
      # Volumen nombrado con la base de datos de Keycloak (H2): sin el, cada vez que se
      # recrea el contenedor se pierde el realm y todos los usuarios que se hayan creado
      # (los "fantmas" que sincroniza el panel admin, una por cdula). Con el, el realm
      # sobrevive a los reinicios del stack, igual que en el Keycloak de la UIS
      # (`keycloak-uis-data:/opt/keycloak/data`). El import del realm solo crea el realm
      # si no existe, asi que a partir de la segunda vez los usuarios del JSON son solo
      # la semilla inicial.
      - keycloak-reg-data:/opt/keycloak/data
    networks:
      - registraduria
      # Necesaria para resolver `civica-trust-validator`: el autenticador
      # `abca-draft07` valida la cadena de la WIA contra ese servicio, y sin esta
      # red el DNS no resuelve y la validacion se queda en modo "ignorada".
      - avance-eudi

  status-list:
    image: status-list:${STATUS_LIST_VERSION}
    container_name: status-list-reg
    restart: unless-stopped
    environment:
      API_key: reg-status-list-key
      # URL publica: la compone el servicio como <base>token_status_list/<country>/<doctype>/<list>.
      # El proxy unico enruta ese prefijo a este servicio.
      STATUS_LIST_PUBLIC_URL: https://civica-desarrollo.avance.org.co/status-list/pid-registraduria/
    volumes:
      - ./status-list/config/config_service.py:/status-list/app/config_service.py
      - ./status-list/certs:/status-list/certs
      - status-lists:/var/opt/status_lists
      - status-lists-backups:/var/opt/status_list_backup
    networks:
      - registraduria
      - avance-eudi

  pid-issuer:
    build:
      context: ..
      dockerfile: Dockerfile
    image: registraduria-pid-issuer:local
    container_name: pid-issuer-reg
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      status-list:
        condition: service_started
    volumes:
      - ./pid-issuer/issuer-keys.jks:/issuer-keys.jks
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxDirectMemorySize=256M
      # Sin el perfil `insecure`: el issuer valida los certificados de todo HTTPS saliente (el dominio publico
      # tiene certificado valido; el resto de servicios internos van por http en la red docker).
      - SPRING_WEBFLUX_BASE_PATH=/pid-registraduria
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_OPAQUETOKEN_CLIENTID=pid-issuer-srv
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_OPAQUETOKEN_CLIENTSECRET=zIKAV9DIIIaJCzHCVBPlySgU8KgY68U2
      - SPRING_HTTP_CODECS_MAXINMEMORYSIZE=8MB
      - ISSUER_PUBLICURL=https://civica-desarrollo.avance.org.co/pid-registraduria
      # Copias de un solo uso del PID que concede por emisión (lote). La wallet las gasta una por presentación; con 20 se
      # agotaban en una tarde de pruebas. Cada copia lleva la foto, así que no se sube más de 50.
      - ISSUER_CREDENTIALENDPOINT_BATCHISSUANCE_BATCHSIZE=50
      # El emisor compara el htu del DPoP con la URI de la peticion. Sin esto,
      # Spring la reconstruye con el esquema del socket (http, porque el proxy
      # le habla en claro) y el credentialEndpoint rechaza la peticion con
      # 401 "Invalid DPoP proof: JWT htu claim value rejected": el cliente manda
      # el htu de su URL publica (https) y no coinciden.
      - SERVER_FORWARD_HEADERS_STRATEGY=native
      - ISSUER_AUTHORIZATIONSERVER_PUBLICURL=https://civica-desarrollo.avance.org.co/idp-reg/realms/pid-registraduria-realm
      # La introspeccion va por http: el certificado de keycloak:8443 lo firma la
      # "Registraduria Dev Local CA", que NO esta en el truststore del emisor, asi que
      # con https la llamada fallaba el TLS y el emisor no podia validar el token:
      # el credentialEndpoint respondia 401 sin cuerpo. El salto es entre contenedores
      # de la misma red docker, igual que el del trust-validator.
      - ISSUER_AUTHORIZATIONSERVER_INTROSPECTION=http://keycloak:8080/idp-reg/realms/pid-registraduria-realm/protocol/openid-connect/token/introspect
      - ISSUER_KEYSTORE_FILE=file:/issuer-keys.jks
      - ISSUER_KEYSTORE_TYPE=JKS
      - ISSUER_KEYSTORE_PASSWORD=regkeys
      - ISSUER_CREDENTIALREQUESTENCRYPTION_JWKS_ALIAS=request-encryption
      - ISSUER_CREDENTIALREQUESTENCRYPTION_JWKS_PASSWORD=request-encryption
      - ISSUER_NONCE_ENCRYPTIONKEY_ALIAS=nonce-encryption
      - ISSUER_NONCE_ENCRYPTIONKEY_PASSWORD=nonce-encryption
      - ISSUER_PID_MSO_MDOC_SIGNING_KEY_ALIAS=issuance
      - ISSUER_PID_MSO_MDOC_SIGNING_KEY_PASSWORD=issuance
      - ISSUER_PID_SD_JWT_VC_SIGNING_KEY_ALIAS=issuance
      - ISSUER_PID_SD_JWT_VC_SIGNING_KEY_PASSWORD=issuance
      - ISSUER_MDL_SIGNING_KEY_ALIAS=issuance
      - ISSUER_MDL_SIGNING_KEY_PASSWORD=issuance
      - ISSUER_LEARNINGCREDENTIAL_SIGNING_KEY_ALIAS=issuance
      - ISSUER_LEARNINGCREDENTIAL_SIGNING_KEY_PASSWORD=issuance
      - ISSUER_ACCESSCERTIFICATE_ALIAS=access-certificate
      - ISSUER_ACCESSCERTIFICATE_PASSWORD=access-certificate
      # Canal de administracion a Keycloak por http dentro de la red docker (el certificado interno es de la CA de
      # desarrollo y ya no se acepta a ciegas). Keycloak tiene KC_HTTP_ENABLED=true; la introspeccion usa el mismo puerto.
      - ISSUER_KEYCLOAK_SERVER_URL=http://keycloak:8080/idp-reg
      - ISSUER_KEYCLOAK_AUTHENTICATION_REALM=master
      - ISSUER_KEYCLOAK_CLIENT_ID=admin-cli
      - ISSUER_KEYCLOAK_USERNAME=admin
      - ISSUER_KEYCLOAK_PASSWORD=password
      - ISSUER_KEYCLOAK_USER_REALM=pid-registraduria-realm
      - ISSUER_DPOP_REALM=pid-issuer
      - ISSUER_CREDENTIALOFFER_DEFAULTURI=openid-credential-offer://
      - ISSUER_CREDENTIALOFFER_ALLOWEDSCHEMES=https,eu-eaa-offer,openid-credential-offer,haip-vci
      - SPRING_R2DBC_URL=r2dbc:pool:postgresql://postgres:5432/pid_issuer
      - SPRING_R2DBC_USERNAME=pid_issuer
      - SPRING_R2DBC_PASSWORD=pid_issuer
      - ISSUER_STATUSLIST_SERVICE_GENERATE_URI=http://status-list:5000/token_status_list/take
      # Revocar es POST /set (idx, uri, status). Antes apuntaba a /take, que asigna un indice nuevo y no revoca nada.
      - ISSUER_STATUSLIST_SERVICE_REVOKE_URI=http://status-list:5000/token_status_list/set
      # Revocacion por titular (POST /internal/v1/credentials/revoke, solo desde la red docker)
      - ISSUER_REVOCATION_API_KEY=${REG_REVOCATION_API_KEY:-reg-dev-revocation-key-change-me}
      # Reinstalación o cambio de celular: al emitir a una wallet nueva se revoca lo de la anterior (apagado por defecto)
      - ISSUER_REISSUE_REVOKE_PREVIOUS_WALLET=${REG_REISSUE_REVOKE_PREVIOUS_WALLET:-false}
      # Pérdida o robo (wallet=true): el emisor le pide al proveedor de wallet que revoque la instalación (WURevocation_07)
      - ISSUER_WALLET_REVOCATION_URL=http://spartans-wallet-provider:8080/internal/v1/wallet-instances/revoke
      - ISSUER_WALLET_REVOCATION_API_KEY=${WALLETPROVIDER_REVOCATION_APIKEY:-wp-dev-revocation-key-change-me}
      - ISSUER_STATUSLIST_SERVICE_APIKEY=reg-status-list-key
      - ISSUER_WRPRC=${ISSUER_WRPRC}
      - ISSUER_PID_DATASOURCE=registraduria
      # Este issuer emite SOLO la PID de la Registraduría (mdoc + SD-JWT VC)
      - ISSUER_MDL_ENABLED=false
      - ISSUER_LEARNINGCREDENTIAL_ENABLED=false
      # Puente onboarding -> emisión (POST /pid-issuer/onboarding/offers y canje interno de tickets).
      # El onboarding NO publica puertos: se alcanza por la red compartida `avance-eudi`,
      # por nombre de servicio. (Antes era http://192.168.0.240:8195: una IP suelta y un
      # puerto que ya no existe.)
      - ISSUER_ONBOARDING_BACKEND_URL=http://onboarding-backend:8095
      # Clave para pedirle al onboarding que compare la selfie de la sesión con la foto del registro (misma del onboarding).
      - ISSUER_ONBOARDING_INTERNAL_API_KEY=${ONBOARDING_INTERNAL_API_KEY:-onb-internal-dev-key-change-me}
      - ISSUER_TICKET_API_KEY=${REG_TICKET_API_KEY:-reg-dev-ticket-key-change-me}
      # El issuer exige que el client_status presentado por la wallet cubra el período preferido,
      # y que este sea al menos igual a la vigencia de la credencial. La wallet actual no presenta
      # un client_status válido por cinco años; usar el mínimo admitido para permitir la emisión.
      - ISSUER_PID_MSO_MDOC_ENCODER_DURATION=P31D
      - ISSUER_PID_SD_JWT_VC_DURATION=P31D
      - ISSUER_METADATA_PREFERRED_CLIENT_STATUS_PERIOD=P31D
      - ISSUER_PID_ISSUINGCOUNTRY=CO
      - ISSUER_PID_ISSUINGJURISDICTION=CO-DC
      # Pantalla /registraduria/solicitar (cedula -> QR, sin autenticacion). Poner false para apagarla (404).
      - ISSUER_REGISTRADURIA_SOLICITAR_ENABLED=true
      - ISSUER_REGISTRADURIA_ADMIN_USERNAME=admin
      - ISSUER_REGISTRADURIA_ADMIN_PASSWORD=RegAdmin-2026
      # Validacion de la WIA/KA de la wallet contra los anchors del Wallet Provider
      # publicados en la LoTE (ARF v3.0.0, ISSU_19). El trust-validator escucha en
      # la red compartida `avance-eudi` bajo el alias `civica-trust-validator`.
      # Vacio = el issuer no valida nada: la wallet puede presentar cualquier
      # instancia de wallet sin que el issuer lo compruebe.
      - ISSUER_TRUST_SERVICEURL=http://civica-trust-validator:8080/trust
      - ISSUER_METADATA_DISPLAY_0_NAME=Registraduría Nacional del Estado Civil
      - ISSUER_METADATA_DISPLAY_0_LOCALE=es
      # Emblema del emisor (escudo + rotulo "REGISTRADURIA NACIONAL DEL ESTADO CIVIL"), en
      # blanco y con fondo transparente: es lo que la wallet usa como marca de agua de la
      # credencial. El logo pequeno de la tarjeta usa el escudo recortado (escudo-blanco.png).
      - ISSUER_METADATA_DISPLAY_0_LOGO_URI=https://civica-desarrollo.avance.org.co/pid-registraduria/public/img/registraduria/fondos_oscuros.png
      - ISSUER_METADATA_DISPLAY_0_LOGO_ALTERNATIVE_TEXT=Escudo de la Registraduría Nacional del Estado Civil
    networks:
      - registraduria
      # Necesaria para resolver `civica-trust-validator` (validacion de la WIA/KA)
      # y `onboarding-backend` (puente de onboarding).
      - avance-eudi

  haproxy:
    image: haproxy:2.8.3
    container_name: haproxy-reg
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
      pid-issuer:
        condition: service_started
      status-list:
        condition: service_started
    volumes:
      - ./haproxy/haproxy.conf:/usr/local/etc/haproxy/haproxy.cfg
      - ./haproxy/certs/:/etc/ssl/certs/
    networks:
      - registraduria
      - avance-eudi

volumes:
  status-lists:
  status-lists-backups:
  postgres:
  keycloak-reg-data:
