# Portal de control de acceso (portería: foto, nombre y documento del PID). Se une a la red compartida "avance-eudi" con el alias
# app-acceso (srv-nw-nginx le pasa /acceso/… con la ruta completa) y habla con su verifier
# (../_comun, instancia VERIFIER_INSTANCIA) por la misma red, usando el alias de su haproxy.
# Sin volúmenes: no guarda nada.
#
#   ./levantar.sh, o ya creado: docker compose -p acceso --env-file .env logs -f
name: acceso

services:
  acceso:
    build: .
    restart: unless-stopped
    read_only: true
    # El dueño de ./datos (quien ejecutó levantar.sh): ahí se escribe el historial local (historial.jsonl).
    user: ${UID_GID:-1000:1000}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # Base de datos PROPIA del historial (emisiones y verificaciones de este portal): ver el servicio postgres-verif.
      HISTORIAL_DB_URL: postgres://verif_acceso:verif_acceso@postgres-verif:5432/verif_acceso
      URL_PUBLICA: https://${DOMINIO}/${PREFIJO}
      VERIFIER_API: http://verifier-${VERIFIER_INSTANCIA}/verifier-${VERIFIER_INSTANCIA}
      NOMBRE_ENTIDAD: ${NOMBRE_ENTIDAD}
      PUERTO: "80"
    volumes:
      - ./datos:/datos
    networks:
      default: {}   # red del proyecto: por aquí llega a su base de datos
      avance-eudi:
        aliases: ["app-${PREFIJO}"]

  # Base de datos PROPIA de este portal (historial de emisiones y verificaciones). Solo la ve su portal (red del proyecto); para DBeaver
  # se publica únicamente en 127.0.0.1:5461. Va en este mismo compose: si el portal se instala en otro servidor, se lleva su base.
  postgres-verif:
    image: postgres:17-alpine
    container_name: postgres-verif-acceso
    restart: unless-stopped
    environment:
      POSTGRES_DB: verif_acceso
      POSTGRES_USER: verif_acceso
      POSTGRES_PASSWORD: verif_acceso
      TZ: America/Bogota
    ports: ["127.0.0.1:5461:5432"]
    volumes:
      - postgres_verif:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verif_acceso -d verif_acceso"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_verif:
    name: acceso_postgres_verif

networks:
  avance-eudi:
    name: avance-eudi
    external: true
