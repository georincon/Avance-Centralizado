# Banco Cívica: ingreso y apertura de cuenta con la wallet, sin contraseñas. Se une a la red
# compartida "avance-eudi" con el alias app-banco (srv-nw-nginx le pasa /banco/… con la ruta
# completa) y habla con su verifier (../_comun, instancia VERIFIER_INSTANCIA) por la misma red,
# usando el alias de su haproxy, sin salir a internet.
#
# Se usa con ./levantar.sh (que levanta antes el verifier) o, ya creado:
#   docker compose -p banco --env-file .env logs -f
name: banco

services:
  banco:
    build: .
    restart: unless-stopped
    # El dueño de ./datos (quien ejecutó levantar.sh), para poder escribir clientes.json.
    user: ${UID_GID:-1000:1000}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # Base de datos PROPIA del historial (emisiones y verificaciones de este portal): ver el servicio postgres-verif.
      HISTORIAL_DB_URL: postgres://verif_banco:verif_banco@postgres-verif:5432/verif_banco
      URL_PUBLICA: https://${DOMINIO}/${PREFIJO}
      VERIFIER_API: http://verifier-${VERIFIER_INSTANCIA}/verifier-${VERIFIER_INSTANCIA}
      NOMBRE_BANCO: ${NOMBRE_BANCO}
      CLIENTES_ARCHIVO: /datos/clientes.json
      # Emisor de la credencial de cuenta: PKI propia (scripts/generar-claves.sh), índices de la status list y confianza.
      SECRETOS_DIR: /secretos
      EMISIONES_ARCHIVO: /datos/emisiones.json
      TRUST_VALIDATOR_URL: ${TRUST_VALIDATOR_URL}
      PUERTO: "80"
    volumes:
      - ./datos:/datos
      - ./secretos:/secretos:ro
    networks:
      default: {}   # red del proyecto: por aquí llega a su base de datos
      avance-eudi:
        aliases: ["app-${PREFIJO}"]

  # Base de datos PROPIA de este portal (historial de emisiones y verificaciones). Solo la ve su portal (red del proyecto); para DBeaver
  # se publica únicamente en 127.0.0.1:5463. Va en este mismo compose: si el portal se instala en otro servidor, se lleva su base.
  postgres-verif:
    image: postgres:17-alpine
    container_name: postgres-verif-banco
    restart: unless-stopped
    environment:
      POSTGRES_DB: verif_banco
      POSTGRES_USER: verif_banco
      POSTGRES_PASSWORD: verif_banco
      TZ: America/Bogota
    ports: ["127.0.0.1:5463:5432"]
    volumes:
      - postgres_verif:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verif_banco -d verif_banco"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_verif:
    name: banco_postgres_verif

networks:
  avance-eudi:
    name: avance-eudi
    external: true
