# La EPS de ejemplo. Cuelga de la red compartida "avance-eudi" con el alias app-PREFIJO: el nginx
# central le pasa con la ruta completa https://DOMINIO/PREFIJO/… y
# https://DOMINIO/.well-known/<x>/PREFIJO (la metadata del emisor). Habla con su
# verifier (../_comun, instancia VERIFIER_INSTANCIA) por la misma red.
#
# Se usa con ./levantar.sh o, ya creada: docker compose -p eps --env-file .env logs -f
name: eps

services:
  eps:
    build: .
    restart: unless-stopped
    user: ${UID_GID:-1000:1000}
    environment:
      # Base de datos PROPIA del historial (emisiones y verificaciones de este portal): ver el servicio postgres-verif.
      HISTORIAL_DB_URL: postgres://verif_eps:verif_eps@postgres-verif:5432/verif_eps
      URL_PUBLICA: https://${DOMINIO}/${PREFIJO}
      VERIFIER_API: http://verifier-${VERIFIER_INSTANCIA}/verifier-${VERIFIER_INSTANCIA}
      TRUST_VALIDATOR_URL: ${TRUST_VALIDATOR_URL}
      EPS_NOMBRE: ${EPS_NOMBRE}
      ADMIN_CLAVE: ${ADMIN_CLAVE}
      SECRETOS_DIR: /secretos
      AFILIADOS_ARCHIVO: /datos/afiliados.json
      MEDICOS_ARCHIVO: /datos/medicos.json
      PUERTO: "80"
    volumes:
      - ./datos:/datos
      - ./secretos:/secretos:ro
    networks:
      default: {}   # red del proyecto: por aquí llega a su base de datos
      avance-eudi:
        aliases: ["app-${PREFIJO}"]

  # Base de datos PROPIA de este portal (historial de emisiones y verificaciones). Solo la ve su portal (red del proyecto); para DBeaver
  # se publica únicamente en 127.0.0.1:5468. Va en este mismo compose: si el portal se instala en otro servidor, se lleva su base.
  postgres-verif:
    image: postgres:17-alpine
    container_name: postgres-verif-eps
    restart: unless-stopped
    environment:
      POSTGRES_DB: verif_eps
      POSTGRES_USER: verif_eps
      POSTGRES_PASSWORD: verif_eps
      TZ: America/Bogota
    ports: ["127.0.0.1:5468:5432"]
    volumes:
      - postgres_verif:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verif_eps -d verif_eps"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_verif:
    name: eps_postgres_verif

networks:
  # Red privada del proyecto (portal + su base). Subred pequeña y fija: Docker ya agotó sus rangos automáticos con tantos proyectos.
  default:
    ipam:
      config:
        - subnet: 172.16.105.0/28
  avance-eudi:
    name: avance-eudi
    external: true
